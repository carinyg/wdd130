<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <meta name="author" content="Carin Gardner">
        <meta name="description" content="Web development assignment page. Learning about html and css styling. A fictional White Water Refting company's index page.">
        <title>WWR Home Page | Carin Gardner</title>
        <link rel="stylesheet" href="styles/rafting.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Permanent+Marker&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="grid-container">
            <header class="item1">
                <img src="images/wwr_logo.png" alt="company logo">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="trips.html">Trips</a>
                    <a href="contact.html">Contact Us</a>
                </nav>
            </header>
            <main>
                <div class="item2">
                    <div class="hero-grid">
                        <img src="images/hero_transparency.webp" alt="Join us on a rafting trip">
                        <h1>Not all who wander are lost</h1>
                        <h3>-J.R.R. Tolkein</h3>
                    </div>
                </div>
                <div class="item3">
                    <h1>Check out all we have to offer!</h1>
                    <nav class="trips">
                        <a href="trips.html">Click here to see our available packages</a>
                    </nav>
                    <div class="offerings">
                        <figure>
                            <img src="images/vistas-pic.jpg" alt="Stunning vistas">
                            <figcaption>Stunning Vistas</figcaption>
                        </figure>
                        <figure>
                            <img src="images/cabins.jpg" alt="cabins">
                            <figcaption>Camping</figcaption>
                        </figure>
                        <figure>
                            <img src="images/rafting_demo.jpg" alt="various rafting levels">
                            <figcaption>Newbie-Expert Rafting</figcaption>
                        </figure>
                        <figure>
                            <img src="images/groups.jpg" alt="group accomadations">
                            <figcaption>Group Accomadations</figcaption>
                        </figure>
                    </div>
                </div>
                <div class="item4">
                    <form>
                        <fieldset>
                            <legend>Join our newsletter to find out more!</legend>
                            <div class="form-item column2">
                                <label for="fullname">Full name:</label>
                                <input type="text" id="fullname" name="fullname">
                            </div>
                            <div class="form-item column2">
                                <label for="useremail">Email:</label>
                                <input type="email" id="useremail" name="useremail">
                            </div>
                        </fieldset>
                    </form>
                </div>
            </main>
            <footer class="item5">
                <p>©2024 | Whitewater Rafting | Carin Gardner</p>
                <nav class="sociallinks">
                    <a href="https://facebook.com">
                        <img src="images/facebook_icon.webp" alt="Facebook">
                    </a>
                    <a href="https://x.com">
                        <img src="images/X_icon.webp" alt="X">
                    </a>
                    <a href="https://instagram.com">
                        <img src="images/instagram_icon.webp" alt="Instagram">
                    </a>
                </nav>
            </footer>
        </div>
    </body>
</html>
